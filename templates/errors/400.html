{% extends "base.html" %}
{% block title %}400 — Bad Request{% endblock %}

{% block full_page %}
<div class="od-error-page">
  <div class="od-error-card">
    <div class="od-error-code">400</div>
    <div class="od-error-icon"><i class="bi bi-exclamation-diamond"></i></div>
    <h1 class="od-error-title">Bad Request</h1>
    <p class="od-error-message">
      The request could not be understood by the server. This may be caused by a malformed URL,
      an expired form, or missing required data.
    </p>
    <div class="od-error-actions">
      <a href="javascript:history.back()" class="btn btn-od-outline">
        <i class="bi bi-arrow-left me-1"></i> Go Back
      </a>
      <a href="{% url 'dashboard:home' %}" class="btn btn-od-primary">
        <i class="bi bi-speedometer2 me-1"></i> Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock full_page %}
